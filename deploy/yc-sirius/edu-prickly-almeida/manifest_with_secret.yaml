apiVersion: v1
kind: Pod
metadata:
  name: psql-test
  namespace: edu-prickly-almeida
spec:
  containers:
  - name: ubuntu
    image: ubuntu:20.04
    command: ["/bin/bash", "-c", "sleep 3600"]
    env:
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres
          key: password
    volumeMounts:
    - name: ssl-cert
      mountPath: /root/.postgresql/root.crt
      subPath: root.crt
      readOnly: true
  volumes:
  - name: ssl-cert
    secret:
      secretName: postgresql-ssl-cert
  restartPolicy: Never
